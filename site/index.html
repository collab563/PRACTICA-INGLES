<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Practica inglés con cuestionarios interactivos basados en English File Elementary 4th Edition" />
  <title>English Practice — Cuestionarios de Inglés</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📚%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <!-- HEADER -->
  <header class="app-header">
    <div class="container header-inner">
      <a href="#home" class="brand" data-route="home">
        <span class="brand-logo">📚</span>
        <span class="brand-text">English Practice</span>
      </a>
      <nav class="main-nav">
        <a href="#home" data-route="home" class="nav-link active">Inicio</a>
        <a href="#theory" data-route="theory" class="nav-link">Teoría</a>
        <a href="#practice" data-route="practice" class="nav-link">Practicar</a>
        <a href="#translate" data-route="translate" class="nav-link" aria-controls="translatorOverlayRoot" aria-expanded="false">Traducir</a>
        <a href="#review" data-route="review" class="nav-link">Repaso</a>
        <a href="#stats" data-route="stats" class="nav-link">Progreso</a>
      </nav>
      <div class="header-stats">
        <div class="streak-badge" title="Racha de días">
          <span class="streak-icon">🔥</span>
          <span class="streak-num" id="streakNum">0</span>
        </div>
        <div class="points-badge" title="Puntos">
          <span class="points-icon">⭐</span>
          <span class="points-num" id="pointsNum">0</span>
        </div>
        <button id="themeToggle" class="theme-toggle" aria-label="Cambiar tema">🌙</button>
      </div>
    </div>
  </header>

  <!-- MAIN VIEW -->
  <main id="mainView" class="container"></main>
  <div id="translatorOverlayRoot"></div>

  <!-- FOOTER -->
  <footer class="app-footer">
    <div class="container">
      <p>Hecho con ❤️ para practicar inglés · Basado en el contenido de <em>English File Elementary 4th Edition</em></p>
    </div>
  </footer>

  <!-- Toast notifications -->
  <div id="toast" class="toast"></div>

  <!-- Scripts -->
  <script src="data/files.js"></script>
  <script src="data/theory.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/router.js"></script>
  <script src="js/exercises.js"></script>
  <script src="js/translator.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
